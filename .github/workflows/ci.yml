name: CI

on:
  pull_request:
    branches: [main]
  # The Pages workflow calls these same checks for pushes and manual deploys.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check types
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Install Chromium and system libraries
        run: bunx playwright install --with-deps chromium

      - name: Build and test root and subpath deployments
        run: bun run test:e2e

      - name: Upload browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-browser-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
