name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a deployment already in progress. GitHub retains the latest
# pending run, so new pushes are eventually published after the current run.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    # A manual run on another branch must not publish that branch.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Pages artifact
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for the configured Pages URL
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
        run: bun run build

      - name: Install Chromium and system libraries
        run: bunx playwright install --with-deps chromium

      - name: Test the artifact to be published
        run: bun run test:e2e:built

      - name: Check required static files
        run: |
          test -f .output/public/index.html
          test -f .output/public/design/index.html
          test -f .output/public/404.html
          test -f .output/public/.nojekyll

      - name: Upload browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: pages-browser-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public
          include-hidden-files: true

  deploy:
    name: Publish Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
